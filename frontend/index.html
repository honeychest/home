<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- viewport-fit=cover: PWA standalone 상태바 아래까지 웹 콘텐츠가 그려지게 함
         (env(safe-area-inset-*) 가 이 값 없이는 항상 0으로 계산됨) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS PWA 상태바를 반투명 오버레이로 — 기본(불투명 회색/흰색) 상태바가 recipe 로그인
         화면 배경과 안 맞아 얇은 경계선처럼 보이는 문제 수정 (2026-07-24 recipe 실사용 확인).
         전체 앱 공용 설정이라 recipe 외 다른 화면에도 적용되지만, 실제 "홈 화면에 추가"로
         standalone 실행되는 건 현재 recipe 뿐이라 실질 영향은 recipe 로 국한됨 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
