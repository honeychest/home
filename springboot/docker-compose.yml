# Purpose: 로컬 .env 설정을 유지하면서, Docker 환경에서만 DB 주소를 가로채서 변경함
x-logging: &default-logging
  driver: json-file
  options:
    # Docker 컨테이너 표준출력/표준에러 로그 설정 확인:
    # 현재 컨테이너에 적용된 로그 드라이버와 옵션 확인
    # docker inspect <container> --format '{{json .HostConfig.LogConfig}}'
    # 현재 컨테이너 로그 파일의 실제 경로 확인
    # docker inspect <container> --format '{{.LogPath}}'
    # 현재 활성 로그 파일 크기 확인
    # ls -lh "$(docker inspect <container> --format '{{.LogPath}}')"
    # 롤링된 로그 파일까지 포함한 전체 로그 파일 개수와 크기 확인
    # ls -lh "$(dirname "$(docker inspect <container> --format '{{.LogPath}}')")"
    # 의미: 컨테이너 stdout/stderr 로그를 파일당 50MB, 최대 3개까지 보관
    max-size: "50m"
    max-file: "3"

x-common: &common
  image: localhost:5010/chsproject-docker:latest
  env_file:
    - .env
  networks:
    - chs-network
  restart: always
  logging: *default-logging
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro # Docker 소켓 접근 권한 필요 모니터링에서 조회하기위해 명령어 날리려고.
  environment: &common-env
    RABBIT_HOST: ${RABBIT_HOST}
    RABBIT_USERNAME: ${RABBIT_USERNAME}
    RABBIT_PASSWORD: ${RABBIT_PASSWORD}
    JAVA_OPTS: -Xms128m -Xmx512m -XX:+UseSerialGC
    DATASOURCE_URL: jdbc:mysql://mysql-db:3306/lab-db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    REDIS_HOST: chs-redis
        # 앱 컨테이너는 Docker 네트워크 내부 listener로 Kafka에 접속
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  app1:
    <<: *common
    container_name: chs-app-1
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *common-env
      SERVER_NAME: DOCKER1
      TELEGRAM_MODE: polling
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M

  app2:
    <<: *common
    container_name: chs-app-2
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      <<: *common-env
      SERVER_NAME: DOCKER2
      TELEGRAM_MODE: polling
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M


  # gikka(기까) — recipe 전용 독립 앱 (2026-07-26 분리, docs/recipe/CONTEXT.md 18절).
  # app1/app2 와 같은 파일에 둔 이유는 배포 편의뿐이다 — 이미지·컨테이너·재기동이 완전히 별개라
  # 한쪽을 배포해도 다른 쪽은 안 내려간다(그게 분리한 목적).
  #
  # <<: *common 을 안 쓴다: 저 앵커는 chsproject-docker 이미지와 MySQL·Rabbit·Kafka·Redis
  # 환경변수를 함께 달고 오는데, gikka 는 그중 무엇도 쓰지 않는다(DB 는 PG 의 gikka 하나뿐).
  # env_file 로 .env 를 통째로 주입하지 않는 이유도 같다 — 안 쓰는 시크릿까지 컨테이너에
  # 들어간다. 필요한 값만 아래 environment 에 명시하고, 값 자체는 compose 가 같은 폴더의
  # .env 에서 보간한다(app1/app2 의 RABBIT_* 와 같은 방식).
  gikka1:
    image: localhost:5010/chs-gikka:latest
    container_name: chs-gikka-1
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - chs-network
    restart: always
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JAVA_OPTS: -Xms128m -Xmx512m -XX:+UseSerialGC
      # PG(chs-pgvector)의 gikka DB 전용 계정 — 이 DB 밖은 접근 권한이 없다.
      GIKKA_DB_USERNAME: ${GIKKA_DB_USERNAME}
      GIKKA_DB_PASSWORD: ${GIKKA_DB_PASSWORD}
      # 비면 조용히 쉰다 — gemini 없으면 분석 워커 휴면, youtube 없으면 메타 조회 생략.
      GIKKA_GEMINI_API_KEY: ${GIKKA_GEMINI_API_KEY}
      GIKKA_YOUTUBE_API_KEY: ${GIKKA_YOUTUBE_API_KEY}
      # 페일오버 알림 (비면 알림만 생략되고 기능은 돈다).
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_CHATID: ${TELEGRAM_CHATID}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M

  nexus:
    image: localhost:5010/chs-nexus:latest
    container_name: chs-nexus
    env_file:
      - /Users/honey/devcontext/project/lab/nexus/.env
    networks:
      - chs-network
    restart: always
    logging: *default-logging
    environment:
      REDIS_URL: redis://chs-redis:6379
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 256M
networks:
  chs-network:
    name: chs-network
    external: true
