# ===== Common =====
spring.application.name=springboot
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.devtools.restart.enabled=false

# Scheduling
spring.task.scheduling.enabled=${SCHEDULING_ENABLED:true}
spring.task.scheduling.pool.size=10


# ===== Datasource =====
# DB 연결정보는 .env + Jasypt 로 주입한다.
spring.datasource.hikari.jdbc-url=${DATASOURCE_URL}
spring.datasource.hikari.username=${DATASOURCE_USER}
spring.datasource.hikari.password=${DATASOURCE_PW}
spring.datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=primary-pool
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=58000
spring.datasource.hikari.keepalive-time=28000

# Batch datasource
spring.datasource.batch.hikari.jdbc-url=${DATASOURCE_URL}
spring.datasource.batch.hikari.username=${DATASOURCE_USER}
spring.datasource.batch.hikari.password=${DATASOURCE_PW}
spring.datasource.batch.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.batch.hikari.pool-name=batch-pool
spring.datasource.batch.hikari.maximum-pool-size=6
spring.datasource.batch.hikari.minimum-idle=2
spring.datasource.batch.hikari.connection-timeout=5000
spring.datasource.batch.hikari.max-lifetime=58000
spring.datasource.batch.hikari.keepalive-time=28000


# ===== Persistence =====
# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration


# ===== Infra =====
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.rabbit.enabled=false
# Lettuce는 ReactiveRedisConnectionFactory도 자동 등록되어, 서블릿(MVC) 전용인 이 앱에서
# redisHealthContributor 빈이 블로킹 대신 리액티브 타입으로 뜨며 BeanNotOfRequiredTypeException 유발.
# 이 앱은 WebFlux를 쓰지 않으므로 리액티브 Redis 헬스 오토컨피그를 제외해 블로킹 타입만 등록되게 한다.
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration

# AWS S3
cloud.aws.s3.bucket=${AWS_S3_BUCKET}
cloud.aws.region=${AWS_REGION}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
archive.retention-days=3
# Phase 4: raw_agg_trade 신규 저장이 중단되어 아카이빙도 중단한다. 테이블과 기존 데이터는 유지한다.
archive.raw-agg-trade.enabled=false


# ===== Kafka =====
# Kafka bootstrap servers
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# Producer
# Required broker acknowledgements for producer send
spring.kafka.producer.acks=all
# Producer retry count
spring.kafka.producer.retries=10
# Idempotent producer option
spring.kafka.producer.properties.enable.idempotence=true
# Producer compression codec
spring.kafka.producer.properties.compression.type=lz4

# Consumer
# Offset reset policy for a new consumer group
spring.kafka.consumer.auto-offset-reset=earliest
# Disable auto commit; listener commits manually after successful DB write
spring.kafka.consumer.enable-auto-commit=false

# Max records returned by one poll
spring.kafka.consumer.properties.max.poll.records=500
# Minimum bytes fetched before broker responds
spring.kafka.consumer.properties.fetch.min.bytes=1
# Max broker wait time for fetch.min.bytes
spring.kafka.consumer.properties.fetch.max.wait.ms=500

# Consumer group
# Consumer group id
kafka.consumer.group-id=raw-writer


# ===== API Docs =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs


# ===== External APIs =====
# Weather
weather.api.service-key=${WEATHER_API_SERVICE_KEY}
weather.api.base-url=${WEATHER_API_BASE_URL}

# Security APIs
google.safebrowsing.api-key=${GOOGLE_SAFE_BROWSING_API_KEY}
virustotal.api-key=${VIRUSTOTAL_API_KEY}


# ===== Telegram =====
telegram_token=${TELEGRAM_TOKEN}
telegram_chatid=${TELEGRAM_CHATID}
telegram.mode=${TELEGRAM_MODE:polling}
telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}


# ===== Admin Auth =====
admin.jwt.secret=${ADMIN_JWT_SECRET}
admin.jwt.access-token-expiration-seconds=${ADMIN_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:360}
admin.jwt.refresh-token-expiration-seconds=${ADMIN_JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:86400}


# ===== Binance =====
# 로컬에서 같은 DB 를 볼 때는 profile override 로 저장을 끈다.
binance.tick-trade.save.enabled=true
binance.agg-trade.save.enabled=false
binance.agg-trade.kafka.enabled=false
binance.raw-tick.enabled=false
binance.rest.spot.base-url=https://api.binance.com
binance.rest.futures.base-url=https://fapi.binance.com


# ===== Chatbot (Spring AI RAG) =====
# LM Studio(OpenAI 호환). base-url 은 프로파일별로 분리(application-local / -prod).
spring.ai.openai.api-key=lm-studio
spring.ai.openai.chat.options.model=Mac-mini-LLM
spring.ai.openai.embedding.options.model=text-embedding-qwen3-embedding-4b
# PGVector 임베딩 차원(실측 2560). 모델 교체 시 재측정+재색인 필요.
chs.pgvector.dimensions=2560
# RAG 검색/색인 정책. 운영값은 ChatbotProperties 에 모아 주입한다.
chs.chatbot.top-k=6
# over-fetch-multiplier: topK*배수 만큼 과조회 후 pageId 가중 재정렬해 상위 topK 반환(소프트 가중).
chs.chatbot.over-fetch-multiplier=4
# page-boost: 현재 pageId 경로 프리픽스에 속한 청크에 더하는 가산점(score 0~1 위). 하드필터 아님.
chs.chatbot.page-boost=0.15
# exclude-path-patterns: 색인 제외 경로 부분문자열(에러 안내 화면/템플릿만 한정).
chs.chatbot.reindex.exclude-path-patterns=frontend/src/page/error/,frontend/src/page/forbidden/,springboot/src/main/resources/templates/error-
# batch-size: 임베딩 묶음 크기. 4→8 로 상향(로컬모델 여유 내 색인 속도 개선).
chs.chatbot.reindex.batch-size=8
# chunk-size: 청크 목표 토큰. 256→512 로 상향(메서드 보존, 청크 수 약 절반).
chs.chatbot.reindex.chunk-size=512
# min-chunk-size-chars: 200→350(Spring 기본값) 으로 상향해 자잘한 조각 억제.
chs.chatbot.reindex.min-chunk-size-chars=350
chs.chatbot.reindex.min-chunk-length-to-embed=5
chs.chatbot.reindex.max-num-chunks=10000
chs.chatbot.reindex.keep-separator=true
# 2단계 청킹 전략: TOKEN(기존) | SYMBOL_AWARE(GitNexus 경계 분할).
chs.chatbot.reindex.chunk-strategy=SYMBOL_AWARE
# 인접 청크 오버랩 토큰 수(경계 손실 방지). 0=오버랩 없음.
chs.chatbot.reindex.overlap-tokens=64
# 심볼 경계 조회 대상 GitNexus 저장소명.
chs.chatbot.reindex.gitnexus-repo=lab
# HTTP 클라이언트 타임아웃 — 임베딩 등 외부 호출 무응답 시 무한 대기(hang) 방지.
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=300s
