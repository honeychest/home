# ===== local \uD504\uB85C\uD544 (\uB85C\uCEEC \uAC1C\uBC1C\uC6A9 override) =====
logging.level.root=INFO
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=WARN

# \uC2A4\uCF00\uC904 \uB054 (\uB85C\uCEEC\uC5D0\uC11C \uC2DC\uC7A5/\uC11C\uBC84 \uC911\uBCF5 \uBC29\uC9C0)
#spring.task.scheduling.enabled=false
spring.task.scheduling.enabled=false
binance.oi-backfill.enabled=false
# \uD154\uB808\uADF8\uB7A8 \uD3F4\uB9C1 \uB054 (\uB85C\uCEEC\uC5D0\uC11C \uB2F5\uC7A5 \uC911\uBCF5 \uBC29\uC9C0)
#telegram.mode=disabled
telegram.mode=polling
# JPA: \uB85C\uCEEC\uC5D0\uC11C \uC2A4\uD0A4\uB9C8 \uC790\uB3D9 \uBC18\uC601, SQL \uB85C\uADF8 \uB054
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# devtools \uD56B\uB9AC\uB85C\uB4DC \uB054
spring.devtools.restart.enabled=true

# Actuator health \uC0C1\uC138 \uD45C\uC2DC (\uB514\uBC84\uAE45\uC6A9)
management.endpoint.health.show-details=always

# \uD2F1/\uCCB4\uACB0 DB \uC800\uC7A5 \uB054 (\uB85C\uCEEC+\uD504\uB85C\uB355\uC158 \uAC19\uC740 DB \uC4F8 \uB54C \uC911\uBCF5 \uBC29\uC9C0)
binance.tick-trade.save.enabled=false

# AggTrade Redis enqueue \uBE44\uD65C (\uB85C\uCEEC Redis \uC5F0\uACB0 \uC5D0\uB7EC \uBC29\uC9C0)
binance.agg-trade.save.enabled=false

# Kafka local development: host port exposed by chs/server/docker-infra.yml
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
kafka.consumer.group-id=raw-writer-local
# 로컬과 prod 가 동일 DB 를 바라보므로, 로컬 인스턴스가 리더가 되더라도 raw-writer 파이프라인은 항상 OFF.
chs.raw-writer.force-off=true
# CORS \uD5C8\uC6A9 origin (\uB85C\uCEEC Vite dev server)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://121.170.210.60:5173,http://121.170.210.60:5174

# DRAFT log (chs.dlog)
dlog.enabled=true

# Alert history rows written/read by this profile
monitor.alert-history.source-env=local
# 로컬에서는 헬스 전이 텔레그램 발송 차단(이력 기록은 유지). 기본값 true 는 운영에서 적용.
monitor.health.alert-enabled=false

# ===== Chatbot (local) =====
# LM Studio: 이 dev PC 는 Tailscale 로 Mac mini 의 LM Studio 에 접속
spring.ai.openai.base-url=http://100.69.229.3:2345
# PGVector: 운영 Mac mini 의 공유 PG(Tailscale 100.69.229.3:5432) 로 접속
chs.pgvector.url=jdbc:postgresql://100.69.229.3:5432/chs_vector
chs.pgvector.username=${PGVECTOR_USERNAME:postgres}
chs.pgvector.password=${PGVECTOR_PASSWORD:postgres}

# ===== gikka / recipe (local) — docs/recipe/CONTEXT.md 분리 규율 5·8 =====
# 같은 PG 컨테이너의 별도 gikka DB. 전용 계정 gikka 는 gikka DB 만 접근 가능.
gikka.datasource.url=jdbc:postgresql://100.69.229.3:5432/gikka
gikka.datasource.username=${GIKKA_DB_USERNAME:gikka}
gikka.datasource.password=${GIKKA_DB_PASSWORD:gikka}
# 개발 편의: Google 로그인 없이 이 이메일의 가짜 사용자로 동작 (prod 설정 금지)
gikka.auth.dev-user-email=scollo1982@gmail.com
# 로컬은 dev 폴백이 로그인을 대신해 이 값이 "로그인 허용 목록"으로는 안 쓰이고, isOwner() 판정
# (모니터링 화면 등 오너 전용 기능 노출)에만 쓰인다 — prod 의 allowed-emails 와 동일 값 (2026-07-13)
gikka.auth.allowed-emails=scollo1982@gmail.com
# 로컬 개발기는 도커 컨테이너가 아니라 host.docker.internal 이 안 먹힘 — Tailscale IP 로 직접 접속
# (spring.ai.openai.base-url 과 동일한 이유). mac-mini 의 gikka-local 서비스가 안 떠 있으면
# 자동으로 Gemini 전체 폴백되니(HybridRecipeExtractor) 반드시 켜져 있을 필요는 없음.
gikka.media.local-extractor-base-url=http://100.69.229.3:8765
# 색인 대상 = 백엔드 소스 + 프론트 소스 + 생성 문서(docs/generated) (소스 폴더만 지정 → node_modules/build 미접근)
chs.chatbot.index-roots=C:/Users/Tissue/IdeaProjects/home/springboot/src,C:/Users/Tissue/IdeaProjects/home/frontend/src,C:/Users/Tissue/IdeaProjects/home/docs/generated
# source 메타데이터는 레포 루트 기준으로 기록 (예: springboot/src/... , frontend/src/...)
chs.chatbot.source-base=C:/Users/Tissue/IdeaProjects/home
# 모델 선택 정책: 채팅방(sessionId)별 Codex 성공 답변 2회 후 LOCAL 자동 전환
chs.chatbot.model.codex-enabled=true
chs.chatbot.model.codex-limit-per-chat=2
chs.chatbot.model.codex-timeout-seconds=30
chs.chatbot.model.codex-runner-mode=external
chs.chatbot.model.codex-runner-url=http://127.0.0.1:9876
chs.chatbot.model.codex-run-path=/api/codex/run
