# [AGENT] gikka 운영 프로파일 — docs/recipe/CONTEXT.md 분리 규율 5·8
# 같은 chs-pgvector 컨테이너의 별도 gikka DB. 전용 계정은 gikka DB 만 접근 가능.
# dev-user-email 은 prod 에 절대 설정하지 말 것 (무인증 통과 구멍이 됨).
gikka.datasource.url=jdbc:postgresql://chs-pgvector:5432/gikka
gikka.datasource.username=${GIKKA_DB_USERNAME}
gikka.datasource.password=${GIKKA_DB_PASSWORD}

# 2단계 공개 (2026-07-20 확정 — 친구들에게 오픈): allowed-emails 를 아예 설정하지 않으면
# GikkaAuthProperties 의 기본값(빈 목록)이 그대로 적용돼 구글 계정 누구나 로그인 가능
# (빈 문자열로 값을 주면 relaxed binding 이 원소 1개짜리 목록으로 묶어 오히려 전원 차단될
# 여지가 있어 — 아예 줄을 지워 기본값에 맡기는 쪽을 택함). 오너 전용 화면(모니터링 등) 판정은
# 이 목록과 무관한 owner-email 이 담당 — allowed-emails 를 비워도 오너가 같이 안 막힘.
gikka.auth.owner-email=scollo1982@gmail.com
