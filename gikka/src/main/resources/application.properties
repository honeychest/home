# [AGENT] gikka(기까) 공통 설정 — springboot/ 에서 gikka.* 만 들어낸 것.
# 환경변수 이름은 분리 전과 똑같다(GIKKA_*, TELEGRAM_*) — 서버 .env 를 그대로 재사용한다.
spring.application.name=gikka

# ===== 환경 구분 (springboot 와 같은 방식) =====
# 값을 안 주면 local — 운영 컨테이너는 .env(도커 env_file)의 SPRING_PROFILES_ACTIVE=prod 로 덮는다.
# 기본을 prod 가 아니라 local 로 두는 이유: 실수로 프로파일이 빠졌을 때 운영 DB 자격증명이
# 없어 그냥 못 뜨는 편이, 로컬 개발기가 조용히 운영 설정으로 도는 것보다 안전하다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# 앱 자체는 8080 으로 뜨고 도커가 호스트 포트로 매핑한다 (springboot 와 같은 방식).
# 로컬은 springboot(8080)와 겹치므로 application-local.properties 가 8090 으로 덮는다.
server.port=8080

# ===== 스케줄러 — RegistrationWorker(@Scheduled fixedDelay 5s) 하나뿐 =====
# springboot 는 풀 10 이었지만 여기 스케줄 작업은 등록 워커 하나라 2 로 충분하다.
# SCHEDULING_ENABLED=false 로 워커만 끈 채 API 서버로 띄울 수 있다(장애 시 격리용).
spring.task.scheduling.enabled=${SCHEDULING_ENABLED:true}
spring.task.scheduling.pool.size=2

# ===== 외부 HTTP(RestClient.Builder 주입분 전체에 적용) =====
# read-timeout 이 긴 이유: Gemini 영상 분석 한 건이 분 단위로 걸린다. 줄이면 정상 분석이
# 타임아웃으로 실패 처리된다. mac-mini 로컬 추출(yt-dlp+whisper)도 같은 이유로 길다.
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=300s

# ===== 인증 — docs/recipe/CONTEXT.md 인증 절 =====
gikka.auth.google-client-id=255145024341-3pgdiae32kuhalrqtcsbahjjmn54mkq2.apps.googleusercontent.com

# ===== 영상 분석 (3차) — docs/recipe/CONTEXT.md 레시피 절 =====
# 2026-07-26 gikka.media.* 를 관심사별로 분할 (값 하나가 필요한 쪽이 열 개짜리 덩어리를
# 통째로 주입받던 문제). 환경변수 이름은 그대로라 배포 설정은 무변경.
#
# --- LLM 호출 (external/GikkaLlmProperties) ---
# 키 2개 (2026-07-12 실측 — 구글이 키 체계 분리): Gemini 는 AI Studio 신형 키(AQ.),
# YouTube Data API 는 구형 클라우드 키(AIza). 둘 다 gikka 프로젝트·무료·결제 연결 금지.
# 비어 있으면: llm → 분석 워커 휴면, youtube → 메타 조회 생략 (로컬 기본).
gikka.llm.api-key=${GIKKA_GEMINI_API_KEY:}
# 2.5-flash 는 신규 키에 폐쇄 (2026-07-12 실측) — 3.5-flash 사용
gikka.llm.model=gemini-3.5-flash
# 모델 폐쇄(404) 시 자동 전환 + 텔레그램 알림 (latest 상시 사용은 품질 변동 때문에 비상용으로만)
gikka.llm.fallback-model=gemini-flash-latest
# 인스턴스 합산 호출 간격 하한 — 무료 등급 분당 한도 보호
gikka.llm.min-interval-seconds=6

# --- 유튜브 메타·등록 정책 (registration/GikkaYoutubeProperties) ---
gikka.youtube.api-key=${GIKKA_YOUTUBE_API_KEY:}
gikka.youtube.max-video-minutes=7

# --- mac-mini 호스트 서비스 (external/GikkaHostServiceProperties) ---
# 로컬 모델 페일오버 (2026-07-14 확정) — mac-mini 호스트 상시 서비스 (gikka-extractor/README.md).
# 앱이 도커 컨테이너라 yt-dlp·ffmpeg·whisper 직접 실행 불가 → host.docker.internal 로 호출.
# LLM 설정과 갈라 둔 이유: 이 주소는 X 영상 다운로드(yt-dlp만 씀)도 쓴다 — LLM 전용 값이 아니다.
gikka.host-service.base-url=${GIKKA_LOCAL_EXTRACTOR_URL:http://host.docker.internal:8765}
gikka.host-service.enabled=true

# --- 운영 알림 (registration/GikkaNotifyProperties) ---
# 페일오버 알림 — 기존 텔레그램 봇 값을 복사 소유 (분리 규율 5·7). 비면 알림 생략.
gikka.notify.telegram-token=${TELEGRAM_TOKEN:}
gikka.notify.telegram-chat-id=${TELEGRAM_CHATID:}

# --- 재료 신고 → 재분석 승격 (registration/GikkaReportProperties) ---
# 기본값(임계 1 · 상한 2)으로 도는 중 — 공개 시 임계값만 올려 노이즈를 거른다 (코드 무수정).
# gikka.report.analyze-threshold=1
# gikka.report.max-runs=2
