# [AGENT] gikka 로컬 개발 프로파일 — docs/recipe/CONTEXT.md 분리 규율 5·8
# 같은 PG 컨테이너의 별도 gikka DB. 전용 계정 gikka 는 gikka DB 만 접근 가능.
gikka.datasource.url=jdbc:postgresql://100.69.229.3:5432/gikka
gikka.datasource.username=${GIKKA_DB_USERNAME:gikka}
gikka.datasource.password=${GIKKA_DB_PASSWORD:gikka}

# 개발 편의: Google 로그인 없이 이 이메일의 가짜 사용자로 동작 (prod 설정 금지)
gikka.auth.dev-user-email=scollo1982@gmail.com
# 로컬은 dev 폴백이 로그인을 대신하므로 로그인 허용 목록은 안 쓰인다. isOwner() 판정
# (모니터링 화면 등 오너 전용 기능 노출)은 이 값 하나로 — prod 의 owner-email 과 동일 값.
gikka.auth.owner-email=scollo1982@gmail.com

# 로컬 개발기는 도커 컨테이너가 아니라 host.docker.internal 이 안 먹힘 — Tailscale IP 로 직접 접속.
# mac-mini 의 gikka-extractor 서비스가 안 떠 있으면 자동으로 Gemini 전체 폴백되니
# (HybridRecipeExtractor) 반드시 켜져 있을 필요는 없음.
gikka.host-service.base-url=http://100.69.229.3:8765

# springboot(8080)·프론트 dev 서버와 동시에 띄우므로 포트를 비켜 준다.
server.port=8090
