// [AGENT] gikka(기까) — recipe 도메인 전용 Spring Boot 앱.
// springboot/ 에서 들어낸 독립 서비스다 (docs/recipe/CONTEXT.md 18절 "앱 분리").
//
// 의존성은 springboot/build.gradle 을 복사한 것이 아니라, recipe 코드가 실제로 import 하는
// 것만 담았다. 들어내면서 확인된 사실 — recipe 에는 JPA·Redis·Lombok·Kafka·RabbitMQ·
// jasypt·bean validation 사용처가 하나도 없다. DB 접근은 JdbcClient 하나뿐이다.
// 새 의존성을 추가할 때는 "정말 recipe 가 쓰는가"를 먼저 확인할 것 — 이 앱의 가벼움이
// 인스턴스 1개(1GB)로 도는 근거다.
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'   // springboot/ 와 동일 버전 유지
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chs'
version = '0.0.1-SNAPSHOT'
description = 'gikka'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// 소스에 한글 주석이 많다 — 빌드 머신 기본 인코딩(Windows=MS949)에 좌우되지 않게 못박는다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

bootJar {
    archiveFileName = 'gikka.jar'
}

bootRun {
    systemProperty 'spring.devtools.restart.enabled', 'false'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'        // 컨트롤러 · RestClient · Jackson
    implementation 'org.springframework.boot:spring-boot-starter-security'   // GikkaSecurityConfig 의 SecurityFilterChain
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'       // JdbcClient · Hikari · TransactionTemplate
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // /actuator/health — 배포 스크립트 헬스체크

    implementation 'io.github.cdimascio:dotenv-java:3.0.0'                   // 로컬 실행 시 gikka/.env 로드 (운영은 도커 env_file)

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'                 // Flyway 10+ 는 PG 모듈이 분리돼 있다
    runtimeOnly 'org.postgresql:postgresql'

    // 자체 발급 JWT (GikkaJwt) — 구글 토큰 검증은 GoogleTokenVerifier 가 직접 한다
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'   // JUnit5 · Mockito · MockRestServiceServer
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'          // 패키지 방향 규율 (CONTEXT 19절 9·12)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events "started", "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
    afterSuite { desc, result ->
        if (desc.parent == null) {
            println ""
            println "======== 테스트 요약 | ${result.resultType} | 통과 ${result.successfulTestCount} | 실패 ${result.failedTestCount} | 스킵 ${result.skippedTestCount} ========"
            println "======== HTML 리포트: build/reports/tests/test/index.html ========="
            println ""
        }
    }
}
